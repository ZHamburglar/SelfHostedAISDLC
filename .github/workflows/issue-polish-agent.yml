name: Issue Polish Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: self-hosted
    # Only run if the comment is "apply" and posted by the repo owner or collaborator
    if: |
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, 'apply') || startsWith(github.event.comment.body, '/apply'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Issue Polish Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LM_STUDIO_URL: ${{ secrets.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ secrets.LM_STUDIO_MODEL }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/issue-polish-agent.js
