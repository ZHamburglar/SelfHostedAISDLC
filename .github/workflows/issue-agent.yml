name: Issue Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  agent:
    runs-on: self-hosted  # Must be self-hosted so it can reach LM Studio on your network
    # Only run if issue has a recognized label
    if: |
      contains(github.event.issue.labels.*.name, 'bug') ||
      contains(github.event.issue.labels.*.name, 'feature') ||
      contains(github.event.issue.labels.*.name, 'hotfix')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check LM Studio connectivity
        env:
          LM_STUDIO_URL: ${{ secrets.LM_STUDIO_URL }}
        run: |
          if [ -z "$LM_STUDIO_URL" ]; then
            echo "LM_STUDIO_URL is not configured"
            exit 1
          fi
          API_URL="$(node -e "console.log(new URL('/v1/models', process.env.LM_STUDIO_URL).toString())")"
          echo "Checking LM Studio API at $API_URL"
          RESPONSE_FILE="/tmp/lmstudio-models-response.txt"
          if ! curl --silent --show-error --fail --max-time 10 "$API_URL" > "$RESPONSE_FILE"; then
            echo "LM Studio API check failed for $API_URL"
            if [ -s "$RESPONSE_FILE" ]; then
              echo "Response preview:"
              head -c 500 "$RESPONSE_FILE"
              echo
            fi
            exit 1
          fi
          echo "LM Studio API is reachable."

      - name: Run Issue Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LM_STUDIO_URL: ${{ secrets.LM_STUDIO_URL }}       # e.g. http://192.168.1.x:1234
          LM_STUDIO_MODEL: ${{ secrets.LM_STUDIO_MODEL }}   # e.g. mistral-7b-instruct
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/issue-agent.js
