name: Issue Refine

on:
  issue_comment:
    types: [created]

jobs:
  refine:
    runs-on: self-hosted
    if: |
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, 'refine')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refine Issue Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LM_STUDIO_URL: ${{ secrets.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ secrets.LM_STUDIO_MODEL }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REFINE_COMMENT: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/issue-refine.js
